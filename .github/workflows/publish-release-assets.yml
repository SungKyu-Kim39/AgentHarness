name: Publish verified Ned release assets
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable artifact version
        required: true
        default: '0.3.13'
      candidate_run:
        description: Successful candidate build run ID
        required: false
        default: ''
      candidate_source:
        description: Immutable product source SHA
        required: false
        default: ''
      recovery_run:
        description: Optional failed publish run containing the exact already staged release bytes
        required: false
        default: ''
      validation_run:
        description: Successful Windows offline smoke run ID
        required: true
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NED_VERSION: ${{ inputs.version }}
      NED_VALIDATION_RUN: ${{ inputs.validation_run }}
      NED_CANDIDATE_RUN: ${{ inputs.candidate_run }}
      NED_PUBLISH_RECOVERY_RUN: ${{ inputs.recovery_run }}
      NED_CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: startsWith(inputs.version, '0.3.12') || startsWith(inputs.version, '0.3.13')
        with:
          node-version: '24.22.1'
      - name: Install pinned release tools
        if: startsWith(inputs.version, '0.3.12') || startsWith(inputs.version, '0.3.13')
        run: npm ci --no-audit --no-fund
      - name: Finalize and publish the installed release bytes
        if: startsWith(inputs.version, '0.3.12') || startsWith(inputs.version, '0.3.13')
        run: node scripts/publish-ned-release.mjs
      - name: Preserve exact staged binaries for recovery
        if: failure() && (startsWith(inputs.version, '0.3.12') || startsWith(inputs.version, '0.3.13'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ned-${{ inputs.version }}-publish-recovery-${{ inputs.candidate_source }}
          path: |
            downloads/Ned-${{ inputs.version }}-win-x64.exe
            downloads/Ned-${{ inputs.version }}-windows-x64.tgz
          compression-level: 0
          if-no-files-found: ignore
