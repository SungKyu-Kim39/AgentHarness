name: Windows offline installer smoke
on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: Exact immutable installer build
        default: 0.3.8
        type: choice
        options: ['0.3.8', '0.3.7-rebuild1', '0.3.7', 'python-source-probe']
      candidate_source:
        description: Optional immutable candidate source SHA (leave empty for published downloads)
        type: string
        default: ''
  push:
    branches: [work]
    paths:
      - downloads/Ned-0.3.7-win-x64.exe
      - downloads/Ned-0.3.7-rebuild1-win-x64.exe
      # 0.3.8 uses an explicit immutable candidate_source dispatch before publication.
permissions:
  contents: read
jobs:
  offline-install:
    if: inputs.artifact_version != 'python-source-probe'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NED_ARTIFACT_VERSION: ${{ inputs.artifact_version || '0.3.8' }}
      NED_CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - name: Measure the previous installer on the same Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'Ned-baseline.exe'
          $url = 'https://media.githubusercontent.com/media/SungKyu-Kim39/AgentHarness/1392b93209ac9c9ba764eab52f099da1129bcbcc/downloads/Ned-0.3.6-rebuild1-win-x64.exe'
          & curl.exe --fail --location --retry 2 --output $exe $url
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4ee7e8809c1a838e593c3654e99b1f37715fb625216290b7d89613463ea52252') { throw 'Baseline download/hash failed' }
          $install = Join-Path $env:RUNNER_TEMP 'ned-baseline\missing-parent\Ned'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $exe -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw 'Baseline installation failed' }
          $watch.Stop()
          $files = @(Get-ChildItem $install -Recurse -File)
          [ordered]@{ version='0.3.6-rebuild1'; installerMilliseconds=$watch.ElapsedMilliseconds; installedFiles=$files.Count; installedBytes=($files | Measure-Object Length -Sum).Sum } | ConvertTo-Json | Set-Content baseline-smoke.json -Encoding utf8
          $oldRuntime = Join-Path $env:RUNNER_TEMP 'ned-previous-openviking'
          Copy-Item (Join-Path $install 'resources\runtime\windows-x64\openviking') $oldRuntime -Recurse
          "NED_TEST_PREVIOUS_PYTHON=$oldRuntime\python\python.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $uninstall = Start-Process -FilePath (Join-Path $install 'Uninstall Ned.exe') -ArgumentList @('/S', "_?=$install") -Wait -PassThru
          $uninstall.Refresh()
          if ($uninstall.ExitCode -ne 0) { throw 'Baseline uninstall failed' }
          Remove-Item (Split-Path (Split-Path $install)) -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $exe -Force
      - name: Download and verify the exact published installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:NED_CANDIDATE_SOURCE -and $env:NED_CANDIDATE_SOURCE -notmatch '^[a-f0-9]{40}$') { throw 'Invalid candidate source' }
          $directory = if ($env:NED_CANDIDATE_SOURCE) { 'downloads/candidates/' + $env:NED_CANDIDATE_SOURCE } else { 'downloads' }
          $audit = Get-Content "$directory/Ned-$env:NED_ARTIFACT_VERSION-installer-audit.json" -Raw | ConvertFrom-Json
          if ($env:NED_CANDIDATE_SOURCE -and $audit.sourceCommit -ne $env:NED_CANDIDATE_SOURCE) { throw 'Candidate provenance mismatch' }
          "NED_ARTIFACT_SHA256=$($audit.installer.sha256)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $exe = Join-Path $env:RUNNER_TEMP "Ned-$env:NED_ARTIFACT_VERSION-win-x64.exe"
          $url = "https://media.githubusercontent.com/media/SungKyu-Kim39/AgentHarness/$env:GITHUB_SHA/$directory/Ned-$env:NED_ARTIFACT_VERSION-win-x64.exe"
          & curl.exe --fail --location --retry 2 --output $exe $url
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $audit.installer.sha256) { throw 'Installer SHA-256 mismatch' }
          "NED_SMOKE_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install into a missing directory and test bundled Python offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unsafe = Join-Path $env:APPDATA 'Ned\INSTALLATION_MUST_NOT_BE_CREATED'
          $refused = Start-Process -FilePath $env:NED_SMOKE_EXE -ArgumentList @('/S', "/D=$unsafe") -Wait -PassThru
          $refused.Refresh()
          if ($refused.ExitCode -eq 0 -or (Test-Path $unsafe)) { throw 'Installer accepted a private-data directory' }
          $install = Join-Path $env:RUNNER_TEMP 'ned-smoke\missing-parent\Ned'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $env:NED_SMOKE_EXE -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $watch.Stop()
          $python = Join-Path $install 'resources\runtime\windows-x64\openviking\python\python.exe'
          if (!(Test-Path $python)) { throw 'Installed Python missing' }
          # Native SDK code can bypass Python socket hooks. Block Internet
          # egress for these exact test executables on this disposable runner.
          Get-NetFirewallProfile | Select-Object Name,Enabled | ConvertTo-Json | Set-Content firewall-before.json
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          $group = "Ned-CI-$env:GITHUB_RUN_ID"
          "NED_FIREWALL_GROUP=$group" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($program in @($python, $env:NED_TEST_PREVIOUS_PYTHON, (Join-Path $install 'Ned.exe'), (Join-Path $install 'resources\opencode-cli.exe'), (Join-Path $install 'resources\runtime\windows-x64\ghidra\jdk\bin\java.exe'))) {
            New-NetFirewallRule -DisplayName $group -Group $group -Direction Outbound -Action Block -Program $program -RemoteAddress Internet | Out-Null
          }
          $result = @(& $python -I -B distribution/openviking-import-check.py 2>&1)
          $exit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host "$_" }
          if ($exit -ne 0 -or !($result -match 'OPENVIKING_IMPORT_OK') -or !($result -match 'TOKENIZERS_OK 7')) { throw 'Offline OpenViking/tokenizer import failed' }
          $expectedVersion = if ($env:NED_ARTIFACT_VERSION -ne '0.3.7') { '0.5.5' } else { '0.5.4' }
          if (!($result -match "OPENVIKING_VERSION=$([regex]::Escape($expectedVersion))")) { throw 'Wrong bundled OpenViking version' }
          if (!($result -match 'OPENVIKING_ADAPTERS_OK')) { throw 'OpenViking queue/pack adapters failed' }
          $sdk = Join-Path $install 'resources\runtime\windows-x64\openviking\python\Lib\site-packages\ned-sdk-code.zip'
          if (!(Test-Path $sdk)) { throw 'Packed SDK archive missing' }
          $stdout = Join-Path $env:RUNNER_TEMP 'ned-node.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ned-node.stderr.txt'
          $env:ELECTRON_RUN_AS_NODE = '1'
          $node = Start-Process -FilePath (Join-Path $install 'Ned.exe') -ArgumentList @('-p','process.versions.node') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          $node.Refresh()
          if ($node.ExitCode -ne 0 -or (Get-Content $stdout -Raw).Trim() -notmatch '^\d+\.\d+\.\d+$') { throw 'Bundled Node launch failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          "NED_TEST_CURRENT_PYTHON=$python" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_TOKENIZERS_DIR=$(Join-Path $install 'resources\runtime\windows-x64\openviking\tokenizers')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_SKILLS_DIR=$(Join-Path $install 'resources\ned\skills')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_NODE=$(Join-Path $install 'Ned.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_ENGINE=$(Join-Path $install 'resources\opencode-cli.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $files = @(Get-ChildItem $install -Recurse -File)
          $baseline = Get-Content baseline-smoke.json -Raw | ConvertFrom-Json
          [ordered]@{
            schemaVersion=1; product='Ned'; version=$env:NED_ARTIFACT_VERSION; openVikingVersion=$expectedVersion
            candidateSource=$env:NED_CANDIDATE_SOURCE; installerSha256=$env:NED_ARTIFACT_SHA256
            os=[Environment]::OSVersion.Version.ToString()
            installerMilliseconds=$watch.ElapsedMilliseconds
            baselineInstallerMilliseconds=$baseline.installerMilliseconds
            baselineInstalledFiles=$baseline.installedFiles
            baselineInstalledBytes=$baseline.installedBytes
            comparisonOrder='baseline then candidate; single Windows Server runner, not a Win10/11 acceptance benchmark'
            installedFiles=$files.Count
            installedBytes=($files | Measure-Object Length -Sum).Sum
            openVikingImport=$true; tokenizerEncodings=7; bundledNode=$true
            privateDataInstallRejected=$true
            bundledRuntimeInternetBlockedByWindowsFirewall=$true
            importStepModelsPrompted=$false; intranetModelsPrompted=$false; desktopActions=0
            namespaceTestUsesLocalSyntheticModels=($env:NED_ARTIFACT_VERSION -ne '0.3.7')
            realWin10Win11GuiAcceptance=$false
          } | ConvertTo-Json | Set-Content windows-offline-smoke.json -Encoding utf8
          Get-Content windows-offline-smoke.json
      - name: Verify 0.5.4 data migration using the installed Windows runtimes
        if: env.NED_ARTIFACT_VERSION != '0.3.7'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-' + $env:NED_ARTIFACT_VERSION + '-windows-namespace-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Namespace test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', (Resolve-Path $test).Path) -RedirectStandardOutput windows-namespace-test.txt -RedirectStandardError windows-namespace-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-namespace-test.txt
          Get-Content windows-namespace-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Windows namespace migration test failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify file deletion with the installed Windows Node runtime
        if: always() && env.NED_ARTIFACT_VERSION != '0.3.7' && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-' + $env:NED_ARTIFACT_VERSION + '-windows-delete-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Delete test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', (Resolve-Path $test).Path) -RedirectStandardOutput windows-delete-test.txt -RedirectStandardError windows-delete-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-delete-test.txt
          Get-Content windows-delete-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Windows file deletion test failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify real engine compaction length recovery
        if: always() && env.NED_ARTIFACT_VERSION == '0.3.8' && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-0.3.8-windows-compaction-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Compaction test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', (Resolve-Path $test).Path) -RedirectStandardOutput windows-compaction-test.txt -RedirectStandardError windows-compaction-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-compaction-test.txt
          Get-Content windows-compaction-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Windows compaction test failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify Git writes, external reads, Ghidra and large OVPack recovery
        if: always() && env.NED_ARTIFACT_VERSION == '0.3.8' && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resources = Join-Path (Split-Path $env:NED_TEST_NODE) 'resources'
          $env:NED_TEST_RESOURCES = $resources
          $env:NED_TEST_GIT = Join-Path $resources 'runtime\windows-x64\mcp\git\cmd\git.exe'
          $env:NED_TEST_PYTHON = $env:NED_TEST_CURRENT_PYTHON
          $env:NED_TEST_RECOVERY_SCRIPT = Join-Path $resources 'ned\personal-pack-recovery.py'
          $env:NED_TEST_LAUNCHER = Join-Path $resources 'runtime\windows-x64\openviking\launch.py'
          $env:NED_TEST_TOKENIZERS = $env:NED_TEST_TOKENIZERS_DIR
          $env:NED_TEST_GHIDRA = Join-Path $resources 'runtime\windows-x64\ghidra\ghidra'
          $env:NED_TEST_JAVA = Join-Path $resources 'runtime\windows-x64\ghidra\jdk'
          $env:NED_TEST_GHIDRA_WORKER = Join-Path $resources 'ned\rea-ghidra-worker.mjs'
          $test = 'downloads/Ned-0.3.8-windows-native-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Native test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', (Resolve-Path $test).Path) -RedirectStandardOutput windows-native-test.txt -RedirectStandardError windows-native-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-native-test.txt
          Get-Content windows-native-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Windows native operations test failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify installed Python tools with a preinstalled Conda environment
        if: always() && env.NED_ARTIFACT_VERSION == '0.3.8' && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @($env:CONDA, 'C:\Miniconda', 'C:\Miniconda3', 'C:\ProgramData\Miniconda3') | Where-Object { $_ }
          $conda = $candidates | Where-Object { Test-Path (Join-Path $_ 'Scripts\conda.exe') } | Select-Object -First 1
          if (!$conda) { throw 'Python integration requires preinstalled Windows Conda' }
          $env:NED_TEST_CONDA_ROOT = $conda
          $env:CONDA = $conda
          $env:NED_TEST_RESOURCES = Join-Path (Split-Path $env:NED_TEST_NODE) 'resources'
          foreach ($program in @((Join-Path $conda 'python.exe'), (Join-Path $conda 'Scripts\conda.exe'))) {
            New-NetFirewallRule -DisplayName $env:NED_FIREWALL_GROUP -Group $env:NED_FIREWALL_GROUP -Direction Outbound -Action Block -Program $program -RemoteAddress Internet | Out-Null
          }
          $test = 'downloads/Ned-0.3.8-windows-python-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Python test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', (Resolve-Path $test).Path) -RedirectStandardOutput windows-python-test.txt -RedirectStandardError windows-python-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-python-test.txt
          Get-Content windows-python-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Installed Windows Python tools failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Restore disposable runner firewall configuration
        if: always()
        shell: pwsh
        run: |
          if ($env:NED_FIREWALL_GROUP) { Get-NetFirewallRule -Group $env:NED_FIREWALL_GROUP -ErrorAction SilentlyContinue | Remove-NetFirewallRule }
          if (Test-Path firewall-before.json) {
            foreach ($profile in (Get-Content firewall-before.json -Raw | ConvertFrom-Json)) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-offline-smoke-${{ env.NED_ARTIFACT_VERSION }}
          path: |
            windows-offline-smoke.json
            windows-namespace-test.txt
            windows-namespace-stderr.txt
            windows-delete-test.txt
            windows-delete-stderr.txt
            windows-compaction-test.txt
            windows-compaction-stderr.txt
            windows-native-test.txt
            windows-native-stderr.txt
            windows-python-test.txt
            windows-python-stderr.txt
          if-no-files-found: ignore

  python-source-probe:
    if: inputs.artifact_version == 'python-source-probe'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - name: Install the immutable 0.3.7 runtime for a source-only Python probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $audit = Get-Content downloads/Ned-0.3.7-installer-audit.json -Raw | ConvertFrom-Json
          $exe = Join-Path $env:RUNNER_TEMP 'Ned-python-probe-runtime.exe'
          & curl.exe --fail --location --retry 2 --output $exe 'https://media.githubusercontent.com/media/SungKyu-Kim39/AgentHarness/refs/heads/work/downloads/Ned-0.3.7-win-x64.exe'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $audit.installer.sha256) { throw 'Probe runtime hash mismatch' }
          $install = Join-Path $env:RUNNER_TEMP 'ned-python-probe-runtime'
          $process = Start-Process $exe -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw 'Probe runtime installation failed' }
          $resources = Join-Path $env:RUNNER_TEMP 'ned-python-source-resources'
          New-Item -ItemType Directory -Path (Join-Path $resources 'ned') -Force | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $resources 'runtime') -Target (Join-Path $install 'resources\runtime') | Out-Null
          Copy-Item distribution/python-runner.py (Join-Path $resources 'ned\python-runner.py')
          Copy-Item scripts/sidecar-supervisor.py (Join-Path $resources 'ned\python-supervisor.py')
          $candidates = @($env:CONDA, 'C:\Miniconda', 'C:\Miniconda3', 'C:\ProgramData\Miniconda3') | Where-Object { $_ }
          $conda = $candidates | Where-Object { Test-Path (Join-Path $_ 'Scripts\conda.exe') } | Select-Object -First 1
          if (!$conda) { throw 'This source probe requires preinstalled Windows Conda' }
          "NED_TEST_CONDA_ROOT=$conda" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CONDA=$conda" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_NODE=$(Join-Path $install 'Ned.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_RESOURCES=$resources" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-NetFirewallProfile | Select-Object Name,Enabled | ConvertTo-Json | Set-Content python-firewall-before.json
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          $group = "Ned-Python-CI-$env:GITHUB_RUN_ID"
          "NED_PYTHON_FIREWALL_GROUP=$group" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($program in @((Join-Path $install 'Ned.exe'), (Join-Path $resources 'runtime\windows-x64\openviking\python\python.exe'), (Join-Path $conda 'python.exe'), (Join-Path $conda 'Scripts\conda.exe'))) {
            New-NetFirewallRule -DisplayName $group -Group $group -Direction Outbound -Action Block -Program $program -RemoteAddress Internet | Out-Null
          }
      - name: Run current source with actual Conda and the fixed process supervisor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-0.3.8-windows-python-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Python probe hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', (Resolve-Path $test).Path) -RedirectStandardOutput windows-python-source-test.txt -RedirectStandardError windows-python-source-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-python-source-test.txt
          Get-Content windows-python-source-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Windows Python source probe failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Restore source-probe firewall
        if: always()
        shell: pwsh
        run: |
          if ($env:NED_PYTHON_FIREWALL_GROUP) { Get-NetFirewallRule -Group $env:NED_PYTHON_FIREWALL_GROUP -ErrorAction SilentlyContinue | Remove-NetFirewallRule }
          if (Test-Path python-firewall-before.json) { foreach ($profile in (Get-Content python-firewall-before.json -Raw | ConvertFrom-Json)) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled } }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-python-source-probe
          path: |
            windows-python-source-test.txt
            windows-python-source-stderr.txt
