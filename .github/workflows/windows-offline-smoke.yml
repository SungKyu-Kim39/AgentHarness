name: Windows offline installer smoke
on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: Exact immutable installer build
        default: 0.3.8
        type: choice
        options: ['0.3.9', 'release-build', '0.3.8-rebuild1', '0.3.8', '0.3.7-rebuild1', '0.3.7', 'python-source-probe', 'editor-source-build', 'native-agent-source-probe']
      candidate_source:
        description: Optional immutable candidate source SHA (leave empty for published downloads)
        type: string
        default: ''
      editor_run:
        description: Immutable successful 0.3.9 editor build run ID
        type: string
        default: ''
      runtime_source_probe:
        description: Validate the reviewed supervisor replacement on the old immutable candidate (not new installer acceptance)
        type: boolean
        default: false
  push:
    branches: [work]
    paths:
      - downloads/Ned-0.3.7-win-x64.exe
      - downloads/Ned-0.3.7-rebuild1-win-x64.exe
      # 0.3.8 uses an explicit immutable candidate_source dispatch before publication.
permissions:
  contents: read
jobs:
  offline-install:
    if: inputs.artifact_version != 'python-source-probe' && inputs.artifact_version != 'editor-source-build' && inputs.artifact_version != 'native-agent-source-probe' && inputs.artifact_version != 'release-build'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NED_ARTIFACT_VERSION: ${{ inputs.artifact_version || '0.3.8' }}
      NED_CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - name: Measure the previous installer on the same Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'Ned-baseline.exe'
          $url = 'https://media.githubusercontent.com/media/SungKyu-Kim39/AgentHarness/1392b93209ac9c9ba764eab52f099da1129bcbcc/downloads/Ned-0.3.6-rebuild1-win-x64.exe'
          & curl.exe --fail --location --retry 2 --output $exe $url
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4ee7e8809c1a838e593c3654e99b1f37715fb625216290b7d89613463ea52252') { throw 'Baseline download/hash failed' }
          $install = Join-Path $env:RUNNER_TEMP 'ned-baseline\missing-parent\Ned'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $exe -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw 'Baseline installation failed' }
          $watch.Stop()
          $files = @(Get-ChildItem $install -Recurse -File)
          [ordered]@{ version='0.3.6-rebuild1'; installerMilliseconds=$watch.ElapsedMilliseconds; installedFiles=$files.Count; installedBytes=($files | Measure-Object Length -Sum).Sum } | ConvertTo-Json | Set-Content baseline-smoke.json -Encoding utf8
          $oldRuntime = Join-Path $env:RUNNER_TEMP 'ned-previous-openviking'
          Copy-Item (Join-Path $install 'resources\runtime\windows-x64\openviking') $oldRuntime -Recurse
          "NED_TEST_PREVIOUS_PYTHON=$oldRuntime\python\python.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $uninstall = Start-Process -FilePath (Join-Path $install 'Uninstall Ned.exe') -ArgumentList @('/S', "_?=$install") -Wait -PassThru
          $uninstall.Refresh()
          if ($uninstall.ExitCode -ne 0) { throw 'Baseline uninstall failed' }
          Remove-Item (Split-Path (Split-Path $install)) -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $exe -Force
      - name: Download and verify the exact published installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:NED_CANDIDATE_SOURCE -and $env:NED_CANDIDATE_SOURCE -notmatch '^[a-f0-9]{40}$') { throw 'Invalid candidate source' }
          $directory = if ($env:NED_CANDIDATE_SOURCE) { 'downloads/candidates/' + $env:NED_CANDIDATE_SOURCE } else { 'downloads' }
          $audit = Get-Content "$directory/Ned-$env:NED_ARTIFACT_VERSION-installer-audit.json" -Raw | ConvertFrom-Json
          if ($env:NED_CANDIDATE_SOURCE -and $audit.sourceCommit -ne $env:NED_CANDIDATE_SOURCE) { throw 'Candidate provenance mismatch' }
          "NED_ARTIFACT_SHA256=$($audit.installer.sha256)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $exe = Join-Path $env:RUNNER_TEMP "Ned-$env:NED_ARTIFACT_VERSION-win-x64.exe"
          $url = "https://media.githubusercontent.com/media/SungKyu-Kim39/AgentHarness/$env:GITHUB_SHA/$directory/Ned-$env:NED_ARTIFACT_VERSION-win-x64.exe"
          & curl.exe --fail --location --retry 2 --output $exe $url
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $audit.installer.sha256) { throw 'Installer SHA-256 mismatch' }
          "NED_SMOKE_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install into a missing directory and test bundled Python offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unsafe = Join-Path $env:APPDATA 'Ned\INSTALLATION_MUST_NOT_BE_CREATED'
          $refused = Start-Process -FilePath $env:NED_SMOKE_EXE -ArgumentList @('/S', "/D=$unsafe") -Wait -PassThru
          $refused.Refresh()
          if ($refused.ExitCode -eq 0 -or (Test-Path $unsafe)) { throw 'Installer accepted a private-data directory' }
          $install = Join-Path $env:RUNNER_TEMP 'ned-smoke\missing-parent\Ned'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $env:NED_SMOKE_EXE -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $watch.Stop()
          $python = Join-Path $install 'resources\runtime\windows-x64\openviking\python\python.exe'
          if (!(Test-Path $python)) { throw 'Installed Python missing' }
          # Native SDK code can bypass Python socket hooks. Block Internet
          # egress for these exact test executables on this disposable runner.
          Get-NetFirewallProfile | Select-Object Name,Enabled | ConvertTo-Json | Set-Content firewall-before.json
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          $group = "Ned-CI-$env:GITHUB_RUN_ID"
          "NED_FIREWALL_GROUP=$group" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($program in @($python, $env:NED_TEST_PREVIOUS_PYTHON, (Join-Path $install 'Ned.exe'), (Join-Path $install 'resources\opencode-cli.exe'), (Join-Path $install 'resources\runtime\windows-x64\ghidra\jdk\bin\java.exe'))) {
            New-NetFirewallRule -DisplayName $group -Group $group -Direction Outbound -Action Block -Program $program -RemoteAddress Internet | Out-Null
          }
          $result = @(& $python -I -B distribution/openviking-import-check.py 2>&1)
          $exit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host "$_" }
          if ($exit -ne 0 -or !($result -match 'OPENVIKING_IMPORT_OK') -or !($result -match 'TOKENIZERS_OK 7')) { throw 'Offline OpenViking/tokenizer import failed' }
          $expectedVersion = if ($env:NED_ARTIFACT_VERSION -ne '0.3.7') { '0.5.5' } else { '0.5.4' }
          if (!($result -match "OPENVIKING_VERSION=$([regex]::Escape($expectedVersion))")) { throw 'Wrong bundled OpenViking version' }
          if (!($result -match 'OPENVIKING_ADAPTERS_OK')) { throw 'OpenViking queue/pack adapters failed' }
          $sdk = Join-Path $install 'resources\runtime\windows-x64\openviking\python\Lib\site-packages\ned-sdk-code.zip'
          if (!(Test-Path $sdk)) { throw 'Packed SDK archive missing' }
          $stdout = Join-Path $env:RUNNER_TEMP 'ned-node.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ned-node.stderr.txt'
          $env:ELECTRON_RUN_AS_NODE = '1'
          $node = Start-Process -FilePath (Join-Path $install 'Ned.exe') -ArgumentList @('-p','process.versions.node') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          $node.Refresh()
          if ($node.ExitCode -ne 0 -or (Get-Content $stdout -Raw).Trim() -notmatch '^\d+\.\d+\.\d+$') { throw 'Bundled Node launch failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          "NED_TEST_CURRENT_PYTHON=$python" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_TOKENIZERS_DIR=$(Join-Path $install 'resources\runtime\windows-x64\openviking\tokenizers')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_SKILLS_DIR=$(Join-Path $install 'resources\ned\skills')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_NODE=$(Join-Path $install 'Ned.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_ENGINE=$(Join-Path $install 'resources\opencode-cli.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $files = @(Get-ChildItem $install -Recurse -File)
          $baseline = Get-Content baseline-smoke.json -Raw | ConvertFrom-Json
          [ordered]@{
            schemaVersion=1; product='Ned'; version=$env:NED_ARTIFACT_VERSION; openVikingVersion=$expectedVersion
            candidateSource=$env:NED_CANDIDATE_SOURCE; installerSha256=$env:NED_ARTIFACT_SHA256
            os=[Environment]::OSVersion.Version.ToString()
            installerMilliseconds=$watch.ElapsedMilliseconds
            baselineInstallerMilliseconds=$baseline.installerMilliseconds
            baselineInstalledFiles=$baseline.installedFiles
            baselineInstalledBytes=$baseline.installedBytes
            comparisonOrder='baseline then candidate; single Windows Server runner, not a Win10/11 acceptance benchmark'
            installedFiles=$files.Count
            installedBytes=($files | Measure-Object Length -Sum).Sum
            openVikingImport=$true; tokenizerEncodings=7; bundledNode=$true
            privateDataInstallRejected=$true
            bundledRuntimeInternetBlockedByWindowsFirewall=$true
            importStepModelsPrompted=$false; intranetModelsPrompted=$false; desktopActions=0
            namespaceTestUsesLocalSyntheticModels=($env:NED_ARTIFACT_VERSION -ne '0.3.7')
            realWin10Win11GuiAcceptance=$false
          } | ConvertTo-Json | Set-Content windows-offline-smoke.json -Encoding utf8
          Get-Content windows-offline-smoke.json
      - name: Apply the reviewed common supervisor for source validation only
        if: inputs.runtime_source_probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:NED_CANDIDATE_SOURCE -ne '1bc5b3a049c4eafa7bbd163dd231bd8d5ba5b168') { throw 'Unreviewed source probe donor' }
          $lock = Get-Content release-runtime-lock.json -Raw | ConvertFrom-Json
          $resources = Join-Path (Split-Path $env:NED_TEST_NODE) 'resources'
          $runtime = Join-Path $resources 'runtime\windows-x64\openviking'
          if ((Get-FileHash (Join-Path $runtime 'manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd11f6caf6e1b807f74a87213c7a0f9654e2ac6b582ec1c7c4b3765c19edf2cb3') { throw 'Probe donor changed' }
          if ((Get-FileHash scripts/sidecar-supervisor.py -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.supervisorSha256) { throw 'Supervisor source mismatch' }
          if ((Get-FileHash downloads/Ned-0.3.8-supervisor-runtime-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.components.openviking.manifestSha256) { throw 'Supervisor manifest mismatch' }
          Copy-Item scripts/sidecar-supervisor.py (Join-Path $runtime 'sidecar-supervisor.py') -Force
          Copy-Item downloads/Ned-0.3.8-supervisor-runtime-manifest.json (Join-Path $runtime 'manifest.json') -Force
          $proof = Get-Content windows-offline-smoke.json -Raw | ConvertFrom-Json
          $proof | Add-Member -NotePropertyName runtimeSourceOverride -NotePropertyValue $true
          $proof | Add-Member -NotePropertyName newInstallerAcceptance -NotePropertyValue $false
          $proof | ConvertTo-Json | Set-Content windows-offline-smoke.json -Encoding utf8
      - name: Verify 0.5.4 data migration using the installed Windows runtimes
        if: env.NED_ARTIFACT_VERSION != '0.3.7'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-' + $env:NED_ARTIFACT_VERSION + '-windows-namespace-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Namespace test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', '--test-reporter=tap', (Resolve-Path $test).Path) -RedirectStandardOutput windows-namespace-test.txt -RedirectStandardError windows-namespace-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-namespace-test.txt
          Get-Content windows-namespace-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Windows namespace migration test failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify file deletion with the installed Windows Node runtime
        if: always() && env.NED_ARTIFACT_VERSION != '0.3.7' && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-' + $env:NED_ARTIFACT_VERSION + '-windows-delete-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Delete test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', '--test-reporter=tap', (Resolve-Path $test).Path) -RedirectStandardOutput windows-delete-test.txt -RedirectStandardError windows-delete-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-delete-test.txt
          Get-Content windows-delete-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Windows file deletion test failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify real engine compaction length recovery
        if: always() && (startsWith(env.NED_ARTIFACT_VERSION, '0.3.8') || env.NED_ARTIFACT_VERSION == '0.3.9') && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-' + $env:NED_ARTIFACT_VERSION + '-windows-compaction-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Compaction test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', '--test-reporter=tap', (Resolve-Path $test).Path) -RedirectStandardOutput windows-compaction-test.txt -RedirectStandardError windows-compaction-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-compaction-test.txt
          Get-Content windows-compaction-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Windows compaction test failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify Git writes, external reads, Ghidra and large OVPack recovery
        if: always() && (startsWith(env.NED_ARTIFACT_VERSION, '0.3.8') || env.NED_ARTIFACT_VERSION == '0.3.9') && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resources = Join-Path (Split-Path $env:NED_TEST_NODE) 'resources'
          $env:NED_TEST_RESOURCES = $resources
          $env:NED_TEST_GIT = Join-Path $resources 'runtime\windows-x64\mcp\git\cmd\git.exe'
          $env:NED_TEST_PYTHON = $env:NED_TEST_CURRENT_PYTHON
          $env:NED_TEST_RECOVERY_SCRIPT = Join-Path $resources 'ned\personal-pack-recovery.py'
          $env:NED_TEST_LAUNCHER = Join-Path $resources 'runtime\windows-x64\openviking\launch.py'
          $env:NED_TEST_TOKENIZERS = $env:NED_TEST_TOKENIZERS_DIR
          $env:NED_TEST_GHIDRA = Join-Path $resources 'runtime\windows-x64\ghidra\ghidra'
          $env:NED_TEST_JAVA = Join-Path $resources 'runtime\windows-x64\ghidra\jdk'
          $env:NED_TEST_GHIDRA_WORKER = Join-Path $resources 'ned\rea-ghidra-worker.mjs'
          $test = 'downloads/Ned-' + $env:NED_ARTIFACT_VERSION + '-windows-native-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Native test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          # Start-Process -Wait waits for an entire Windows process tree and
          # can hide completed test output behind a leftover descendant. Bound
          # this synthetic CI fixture and always retain its diagnostic output.
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', '--test-reporter=tap', (Resolve-Path $test).Path) -RedirectStandardOutput windows-native-test.txt -RedirectStandardError windows-native-stderr.txt -PassThru
          try {
            if (!$run.WaitForExit(720000)) {
              & taskkill.exe /PID $run.Id /T /F | Out-Null
              throw 'Windows native fixture exceeded its CI budget; see retained output'
            }
            $run.Refresh()
            if ($run.ExitCode -ne 0) { throw 'Windows native operations test failed' }
          } finally {
            Get-Content windows-native-test.txt -ErrorAction SilentlyContinue
            Get-Content windows-native-stderr.txt -ErrorAction SilentlyContinue
          }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify installed Python tools with a preinstalled Conda environment
        if: always() && (startsWith(env.NED_ARTIFACT_VERSION, '0.3.8') || env.NED_ARTIFACT_VERSION == '0.3.9') && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @($env:CONDA, 'C:\Miniconda', 'C:\Miniconda3', 'C:\ProgramData\Miniconda3') | Where-Object { $_ }
          $conda = $candidates | Where-Object { Test-Path (Join-Path $_ 'Scripts\conda.exe') } | Select-Object -First 1
          if (!$conda) { throw 'Python integration requires preinstalled Windows Conda' }
          $env:NED_TEST_CONDA_ROOT = $conda
          $env:CONDA = $conda
          $env:NED_TEST_RESOURCES = Join-Path (Split-Path $env:NED_TEST_NODE) 'resources'
          foreach ($program in @((Join-Path $conda 'python.exe'), (Join-Path $conda 'Scripts\conda.exe'))) {
            New-NetFirewallRule -DisplayName $env:NED_FIREWALL_GROUP -Group $env:NED_FIREWALL_GROUP -Direction Outbound -Action Block -Program $program -RemoteAddress Internet | Out-Null
          }
          $test = 'downloads/Ned-' + $env:NED_ARTIFACT_VERSION + '-windows-python-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Python test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', '--test-reporter=tap', (Resolve-Path $test).Path) -RedirectStandardOutput windows-python-test.txt -RedirectStandardError windows-python-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-python-test.txt
          Get-Content windows-python-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Installed Windows Python tools failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Verify 0.3.9 skills, history, settings and terminal behavior
        if: always() && env.NED_ARTIFACT_VERSION == '0.3.9' && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-0.3.9-windows-upgrade-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Upgrade test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', '--test-reporter=tap', (Resolve-Path $test).Path) -RedirectStandardOutput windows-upgrade-test.txt -RedirectStandardError windows-upgrade-stderr.txt -PassThru
          try {
            if (!$run.WaitForExit(600000)) { & taskkill.exe /PID $run.Id /T /F | Out-Null; throw 'Upgrade fixture exceeded its CI budget' }
            $run.Refresh()
            if ($run.ExitCode -ne 0) { throw 'Installed 0.3.9 upgrade tests failed' }
          } finally {
            Get-Content windows-upgrade-test.txt -ErrorAction SilentlyContinue
            Get-Content windows-upgrade-stderr.txt -ErrorAction SilentlyContinue
          }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Restore disposable runner firewall configuration
        if: always()
        shell: pwsh
        run: |
          if ($env:NED_FIREWALL_GROUP) { Get-NetFirewallRule -Group $env:NED_FIREWALL_GROUP -ErrorAction SilentlyContinue | Remove-NetFirewallRule }
          if (Test-Path firewall-before.json) {
            foreach ($profile in (Get-Content firewall-before.json -Raw | ConvertFrom-Json)) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.runtime_source_probe && 'windows-runtime-source-probe-0.3.8' || format('windows-offline-smoke-{0}', env.NED_ARTIFACT_VERSION) }}
          path: |
            windows-offline-smoke.json
            windows-upgrade-test.txt
            windows-upgrade-stderr.txt
            windows-namespace-test.txt
            windows-namespace-stderr.txt
            windows-delete-test.txt
            windows-delete-stderr.txt
            windows-compaction-test.txt
            windows-compaction-stderr.txt
            windows-native-test.txt
            windows-native-stderr.txt
            windows-python-test.txt
            windows-python-stderr.txt
          if-no-files-found: ignore

  python-source-probe:
    if: inputs.artifact_version == 'python-source-probe'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - name: Install the immutable 0.3.7 runtime for a source-only Python probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $audit = Get-Content downloads/Ned-0.3.7-installer-audit.json -Raw | ConvertFrom-Json
          $exe = Join-Path $env:RUNNER_TEMP 'Ned-python-probe-runtime.exe'
          & curl.exe --fail --location --retry 2 --output $exe 'https://media.githubusercontent.com/media/SungKyu-Kim39/AgentHarness/refs/heads/work/downloads/Ned-0.3.7-win-x64.exe'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $audit.installer.sha256) { throw 'Probe runtime hash mismatch' }
          $install = Join-Path $env:RUNNER_TEMP 'ned-python-probe-runtime'
          $process = Start-Process $exe -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw 'Probe runtime installation failed' }
          $resources = Join-Path $env:RUNNER_TEMP 'ned-python-source-resources'
          New-Item -ItemType Directory -Path (Join-Path $resources 'ned') -Force | Out-Null
          New-Item -ItemType Junction -Path (Join-Path $resources 'runtime') -Target (Join-Path $install 'resources\runtime') | Out-Null
          Copy-Item distribution/python-runner.py (Join-Path $resources 'ned\python-runner.py')
          Copy-Item scripts/sidecar-supervisor.py (Join-Path $resources 'ned\python-supervisor.py')
          $candidates = @($env:CONDA, 'C:\Miniconda', 'C:\Miniconda3', 'C:\ProgramData\Miniconda3') | Where-Object { $_ }
          $conda = $candidates | Where-Object { Test-Path (Join-Path $_ 'Scripts\conda.exe') } | Select-Object -First 1
          if (!$conda) { throw 'This source probe requires preinstalled Windows Conda' }
          "NED_TEST_CONDA_ROOT=$conda" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CONDA=$conda" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_NODE=$(Join-Path $install 'Ned.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_RESOURCES=$resources" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-NetFirewallProfile | Select-Object Name,Enabled | ConvertTo-Json | Set-Content python-firewall-before.json
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          $group = "Ned-Python-CI-$env:GITHUB_RUN_ID"
          "NED_PYTHON_FIREWALL_GROUP=$group" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($program in @((Join-Path $install 'Ned.exe'), (Join-Path $resources 'runtime\windows-x64\openviking\python\python.exe'), (Join-Path $conda 'python.exe'), (Join-Path $conda 'Scripts\conda.exe'))) {
            New-NetFirewallRule -DisplayName $group -Group $group -Direction Outbound -Action Block -Program $program -RemoteAddress Internet | Out-Null
          }
      - name: Run current source with actual Conda and the fixed process supervisor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-0.3.8-windows-python-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Python probe hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', '--test-reporter=tap', (Resolve-Path $test).Path) -RedirectStandardOutput windows-python-source-test.txt -RedirectStandardError windows-python-source-stderr.txt -Wait -PassThru
          $run.Refresh()
          Get-Content windows-python-source-test.txt
          Get-Content windows-python-source-stderr.txt
          if ($run.ExitCode -ne 0) { throw 'Windows Python source probe failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Restore source-probe firewall
        if: always()
        shell: pwsh
        run: |
          if ($env:NED_PYTHON_FIREWALL_GROUP) { Get-NetFirewallRule -Group $env:NED_PYTHON_FIREWALL_GROUP -ErrorAction SilentlyContinue | Remove-NetFirewallRule }
          if (Test-Path python-firewall-before.json) { foreach ($profile in (Get-Content python-firewall-before.json -Raw | ConvertFrom-Json)) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled } }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-python-source-probe
          path: |
            windows-python-source-test.txt
            windows-python-source-stderr.txt


  editor-source-build:
    if: inputs.artifact_version == 'editor-source-build'
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      RUSTUP_TOOLCHAIN: 1.98.1
      ZED_COMMIT_SHA: e8bc16acee5ae1937600d571d441c4b5d7b0d288
      ZED_RELEASE_CHANNEL: stable
      RELEASE_CHANNEL: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the Windows terminal host paths
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.3.10') { exit 0 }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Terminal test prerequisites failed' }
          $env:NED_SHELL_TEST_PYTHON = (Get-Command python.exe).Source
          & node --import tsx --test tests/terminal-jobs.windows.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Windows terminal host test failed' }
      - name: Prepare the pinned source and Ned UI changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content ned-editor-source-lock.json -Raw | ConvertFrom-Json
          $archive = $lock.upstream.artifacts | Where-Object file -eq 'zed-source-v1.28.1.tar.gz'
          $package = Join-Path $env:RUNNER_TEMP 'zed-source.tar.gz'
          & curl.exe --fail --location --retry 2 --output $package $archive.url
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne $archive.sha256) { throw 'Source archive mismatch' }
          $source = Join-Path $env:RUNNER_TEMP 'ned-editor-source'
          $out = Join-Path $env:RUNNER_TEMP 'ned-editor-output'
          New-Item -ItemType Directory $source,$out -Force | Out-Null
          & tar.exe -xzf $package --strip-components=1 -C $source
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          & node scripts/patch-ned-editor.mjs $source
          if ($LASTEXITCODE -ne 0) { throw 'Editor patch failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $artifact = $version + $(if ($env:NED_BUILD_REVISION) { '-' + $env:NED_BUILD_REVISION } else { '' })
          "NED_EDITOR_ARTIFACT=$artifact" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & tar.exe -czf (Join-Path $out "zed-ned-editor-source-v1.28.1-$artifact.tar.gz") -C $source .
          if ($LASTEXITCODE -ne 0) { throw 'Corresponding source packaging failed' }
          "NED_EDITOR_SOURCE=$source" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_EDITOR_OUTPUT=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the edited Windows x64 executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64
          & rustup toolchain install 1.98.1 --profile minimal --component rust-src
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust installation failed' }
          Set-Location $env:NED_EDITOR_SOURCE
          & cargo --config .cargo/bundle-config.toml build --release --locked --package zed --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Editor source build failed' }
          Copy-Item target/x86_64-pc-windows-msvc/release/zed.exe (Join-Path $env:NED_EDITOR_OUTPUT "Ned-editor-${env:NED_EDITOR_ARTIFACT}.exe")
      - name: Check visible menu strings and record binary provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NED_EDITOR_BUILD_SHA = $env:GITHUB_SHA
          @'
          const fs=require('node:fs'),p=require('node:path'),crypto=require('node:crypto');
          const folder=process.env.NED_EDITOR_OUTPUT,version=JSON.parse(fs.readFileSync('package.json')).version,revision=process.env.NED_BUILD_REVISION||'',artifact=process.env.NED_EDITOR_ARTIFACT;
          const binary=`Ned-editor-${artifact}.exe`,archive=`zed-ned-editor-source-v1.28.1-${artifact}.tar.gz`,about=`Ned ${version}`+(revision?' · rebuild '+revision.slice(7):'');
          const exe=fs.readFileSync(p.join(folder,binary));
          const labels=['About Ned','Quit Ned',about,...(version==='0.3.10'?['NED_MANAGED_TERMINAL','PowerShell','CMD']:[])];
          for(const s of labels)if(!exe.includes(Buffer.from(s)))throw Error('Missing compiled UI: '+s);
          for(const s of ['About Zed','Quit Zed'])if(exe.includes(Buffer.from(s)))throw Error('Old compiled menu: '+s);
          const files=[binary,archive].map(name=>{const bytes=fs.readFileSync(p.join(folder,name));return {name,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')}});
          const result={schemaVersion:1,product:'Ned editor',version,buildRevision:revision||undefined,sourceCommit:process.env.NED_EDITOR_BUILD_SHA,upstreamVersion:'1.28.1',upstreamCommit:'e8bc16acee5ae1937600d571d441c4b5d7b0d288',os:'Windows Server 2022',rust:'1.98.1',profile:'release; upstream bundle config; debug symbols disabled; 2 build jobs',files,windowsGuiAcceptance:false};
          fs.writeFileSync(p.join(folder,`build-${artifact}.json`),JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Built editor validation failed' }
      - name: Upload versioned components for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ned-editor-${{ env.NED_EDITOR_ARTIFACT }}-${{ github.sha }}
          path: ${{ env.NED_EDITOR_OUTPUT }}
          if-no-files-found: error

  native-agent-source-probe:
    if: inputs.artifact_version == 'native-agent-source-probe'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - name: Prepare prior Node runtime and new Astryx assets for source tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'Ned-prior.exe'
          & curl.exe --fail --location --retry 2 --output $exe 'https://media.githubusercontent.com/media/SungKyu-Kim39/AgentHarness/bd4c4639dadfeef1a531833dcc9f823908a818bc/downloads/Ned-0.3.8-win-x64.exe'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '860d7cef5230ba632201f3bd51b134b58896f7f10f592d667a1cfaf1efaf7d27') { throw 'Prior installer mismatch' }
          $install = Join-Path $env:RUNNER_TEMP 'ned-source-probe'
          $process = Start-Process -FilePath $exe -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Prior runtime install failed' }
          $group = "Ned-source-CI-$env:GITHUB_RUN_ID"
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          New-NetFirewallRule -DisplayName $group -Group $group -Direction Outbound -Action Block -Program (Join-Path $install 'Ned.exe') -RemoteAddress Internet | Out-Null
          "NED_FIREWALL_GROUP=$group" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $lock = Get-Content astryx-offline-lock.json -Raw | ConvertFrom-Json
          $kit = Join-Path $install ('resources\ned\astryx\' + $lock.archive.name)
          New-Item -ItemType Directory (Split-Path $kit) -Force | Out-Null
          & curl.exe --fail --location --retry 2 --output $kit "https://media.githubusercontent.com/media/SungKyu-Kim39/AgentHarness/$env:GITHUB_SHA/downloads/astryx/$($lock.archive.name)"
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $kit -Algorithm SHA256).Hash.ToLowerInvariant() -ne $lock.archive.sha256) { throw 'Astryx download mismatch' }
          "NED_TEST_NODE=$(Join-Path $install 'Ned.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Diagnose the source-built editor loader separately
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $record = Get-Content downloads/editor/build.json -Raw | ConvertFrom-Json
          $entry = $record.files | Where-Object { $_.name -eq 'Ned-editor-0.3.8-rebuild1.exe' }
          $editor = Join-Path (Split-Path $env:NED_TEST_NODE) 'resources\zed\Zed.exe'
          & curl.exe --fail --location --retry 2 --output $editor "https://media.githubusercontent.com/media/SungKyu-Kim39/AgentHarness/$env:GITHUB_SHA/downloads/editor/$($entry.name)"
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $editor -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) { throw 'Source editor integrity mismatch' }
          $stdout = Join-Path $env:RUNNER_TEMP 'editor-loader.stdout'
          $stderr = Join-Path $env:RUNNER_TEMP 'editor-loader.stderr'
          $probe = Start-Process -FilePath $editor -ArgumentList @('--printenv') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $exited = $probe.WaitForExit(15000)
          if (!$exited) { & taskkill.exe /PID $probe.Id /T /F | Out-Null }
          $probe.Refresh()
          $status = [ordered]@{ schemaVersion=1; sourceOnly=$true; exited=$exited; exitCode=$probe.ExitCode; stdoutBytes=(Get-Item $stdout).Length; stderrBytes=(Get-Item $stderr).Length; editorSha256=$entry.sha256 }
          $status | ConvertTo-Json | Set-Content editor-loader-status.json -Encoding utf8
          $status | ConvertTo-Json
          Remove-Item $stdout,$stderr -Force
          if (!$exited -or $probe.ExitCode -ne 0) { throw 'Source editor loader probe failed' }
      - name: Exercise new native-agent transport and real Windows Astryx build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'downloads/Ned-0.3.8-rebuild1-windows-native-test.cjs'
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Source fixture mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $pattern = 'native Zed|native editor settings|closing a queued|installed Windows Astryx'
          $process = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', ('--test-name-pattern="' + $pattern + '"'), ('"' + (Resolve-Path $test).Path + '"')) -RedirectStandardOutput native-source-test.txt -RedirectStandardError native-source-stderr.txt -Wait -PassThru
          Get-Content native-source-test.txt
          if ($process.ExitCode -ne 0) { throw 'Native source probe failed' }
          [ordered]@{ schemaVersion=1; sourceOnly=$true; newInstallerAcceptance=$false; usesPriorInstalledNode=$true; newAstryxFilesCopied=$true; modelEndpoints='localhost synthetic'; internetEgress='Ned Node blocked'; sourceCommit=$env:GITHUB_SHA } | ConvertTo-Json | Set-Content native-source-status.json -Encoding utf8
      - name: Remove disposable firewall rules
        if: always()
        shell: pwsh
        run: |
          if ($env:NED_FIREWALL_GROUP) { Get-NetFirewallRule -Group $env:NED_FIREWALL_GROUP -ErrorAction SilentlyContinue | Remove-NetFirewallRule }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-agent-source-probe
          path: |
            editor-loader-status.json
            native-source-test.txt
            native-source-stderr.txt
            native-source-status.json

  release-build:
    if: inputs.artifact_version == 'release-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NED_EDITOR_RUN: ${{ inputs.editor_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Prepare build-machine space and Java 21
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          df -h .
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and audit immutable installer candidate
        id: candidate
        run: node scripts/release-0.3.9.mjs candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ned-0.3.9-release-state-${{ steps.candidate.outputs.source_sha }}
          path: .cache/ned/release-state
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
