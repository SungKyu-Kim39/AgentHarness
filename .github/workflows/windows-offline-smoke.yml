name: Windows offline installer smoke
on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: Exact immutable installer build
        default: 0.4.1
        type: choice
        options: ['0.4.1', '0.4.0', '0.3.16-rebuild1', '0.3.16', '0.3.15', '0.3.14', '0.3.13', '0.3.12-rebuild2', '0.3.12-rebuild1', '0.3.12', 'terminal-source-probe', 'terminal-editor-probe', 'global-skills-source-probe', 'release-build', 'editor-source-build']
      build_revision:
        description: Optional same-version repair revision (e.g. rebuild1)
        type: string
        default: ''
      candidate_source:
        description: Optional immutable candidate source SHA (leave empty for published downloads)
        type: string
        default: ''
      candidate_run:
        description: Successful Actions build containing the immutable candidate installers
        type: string
        default: ''
      editor_run:
        description: Immutable successful editor build run ID
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  offline-install:
    if: startsWith(inputs.artifact_version, '0.3.') || startsWith(inputs.artifact_version, '0.4.')
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NED_ARTIFACT_VERSION: ${{ inputs.build_revision && format('{0}-{1}', inputs.artifact_version, inputs.build_revision) || inputs.artifact_version || '0.4.1' }}
      NED_CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - name: Download and verify the exact published installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:NED_CANDIDATE_SOURCE -and $env:NED_CANDIDATE_SOURCE -notmatch '^[a-f0-9]{40}$') { throw 'Invalid candidate source' }
          $directory = if ($env:NED_CANDIDATE_SOURCE) { 'downloads/candidates/' + $env:NED_CANDIDATE_SOURCE } else { 'downloads' }
          $audit = Get-Content "$directory/Ned-$env:NED_ARTIFACT_VERSION-installer-audit.json" -Raw | ConvertFrom-Json
          if ($env:NED_CANDIDATE_SOURCE -and $audit.sourceCommit -ne $env:NED_CANDIDATE_SOURCE) { throw 'Candidate provenance mismatch' }
          "NED_ARTIFACT_SHA256=$($audit.installer.sha256)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $exe = Join-Path $env:RUNNER_TEMP "Ned-$env:NED_ARTIFACT_VERSION-win-x64.exe"
          if ($env:NED_CANDIDATE_SOURCE) {
            $candidateRun = '${{ inputs.candidate_run }}'
            if ($candidateRun -notmatch '^[0-9]+$') { throw 'Candidate Actions run ID required' }
            $files = Join-Path $env:RUNNER_TEMP 'ned-immutable-candidate'
            gh run download $candidateRun --repo $env:GITHUB_REPOSITORY --name "ned-$env:NED_ARTIFACT_VERSION-installer-assets-$env:NED_CANDIDATE_SOURCE" --dir $files
            if ($LASTEXITCODE -ne 0) { throw 'Candidate Actions download failed' }
            $exe = Join-Path $files (Split-Path $exe -Leaf)
            "NED_SMOKE_CANDIDATE_DIR=$files" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:NED_ARTIFACT_VERSION/Ned-$env:NED_ARTIFACT_VERSION-win-x64.exe"
            "NED_CANDIDATE_SOURCE=$($audit.sourceCommit)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            & curl.exe --fail --location --retry 2 --output $exe $url
            if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $audit.installer.sha256) { throw 'Installer SHA-256 mismatch' }
          "NED_SMOKE_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install into a missing directory and test bundled Python offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unsafe = Join-Path $env:APPDATA 'Ned\INSTALLATION_MUST_NOT_BE_CREATED'
          $refused = Start-Process -FilePath $env:NED_SMOKE_EXE -ArgumentList @('/S', "/D=$unsafe") -Wait -PassThru
          $refused.Refresh()
          if ($refused.ExitCode -eq 0 -or (Test-Path $unsafe)) { throw 'Installer accepted a private-data directory' }
          $install = Join-Path $env:RUNNER_TEMP 'ned-smoke\missing-parent\Ned'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $env:NED_SMOKE_EXE -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $watch.Stop()
          $python = Join-Path $install 'resources\runtime\windows-x64\openviking\python\python.exe'
          if (!(Test-Path $python)) { throw 'Installed Python missing' }
          # Native SDK code can bypass Python socket hooks. Block Internet
          # egress for these exact test executables on this disposable runner.
          Get-NetFirewallProfile | Select-Object Name,Enabled | ConvertTo-Json | Set-Content firewall-before.json
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          $group = "Ned-CI-$env:GITHUB_RUN_ID"
          "NED_FIREWALL_GROUP=$group" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($program in (@($python, (Join-Path $install 'Ned.exe'), (Join-Path $install 'resources\opencode-cli.exe'), (Join-Path $install 'resources\runtime\windows-x64\ghidra\jdk\bin\java.exe')) | Where-Object { $_ })) {
            New-NetFirewallRule -DisplayName $group -Group $group -Direction Outbound -Action Block -Program $program -RemoteAddress Internet | Out-Null
          }
          $result = @(& $python -I -B distribution/openviking-import-check.py 2>&1)
          $exit = $LASTEXITCODE
          $result | ForEach-Object { Write-Host "$_" }
          if ($exit -ne 0 -or !($result -match 'OPENVIKING_IMPORT_OK') -or !($result -match 'TOKENIZERS_OK 7')) { throw 'Offline OpenViking/tokenizer import failed' }
          $expectedVersion = '0.5.5'
          if (!($result -match "OPENVIKING_VERSION=$([regex]::Escape($expectedVersion))")) { throw 'Wrong bundled OpenViking version' }
          if (!($result -match 'OPENVIKING_ADAPTERS_OK')) { throw 'OpenViking queue/pack adapters failed' }
          if ($env:NED_ARTIFACT_VERSION -ne '0.3.12' -and !($result -match 'OPENVIKING_MIME_OK')) { throw 'OpenViking MIME configuration failed' }
          $sdk = Join-Path $install 'resources\runtime\windows-x64\openviking\python\Lib\site-packages\ned-sdk-code.zip'
          if (!(Test-Path $sdk)) { throw 'Packed SDK archive missing' }
          $stdout = Join-Path $env:RUNNER_TEMP 'ned-node.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ned-node.stderr.txt'
          $env:ELECTRON_RUN_AS_NODE = '1'
          $node = Start-Process -FilePath (Join-Path $install 'Ned.exe') -ArgumentList @('-p','process.versions.node') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          $node.Refresh()
          if ($node.ExitCode -ne 0 -or (Get-Content $stdout -Raw).Trim() -notmatch '^\d+\.\d+\.\d+$') { throw 'Bundled Node launch failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          "NED_TEST_CURRENT_PYTHON=$python" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_TOKENIZERS_DIR=$(Join-Path $install 'resources\runtime\windows-x64\openviking\tokenizers')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_SKILLS_DIR=$(Join-Path $install 'resources\ned\skills')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_NODE=$(Join-Path $install 'Ned.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_TEST_ENGINE=$(Join-Path $install 'resources\opencode-cli.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $files = @(Get-ChildItem $install -Recurse -File)
          [ordered]@{
            schemaVersion=1; product='Ned'; version=$env:NED_ARTIFACT_VERSION; openVikingVersion=$expectedVersion
            candidateSource=$env:NED_CANDIDATE_SOURCE; installerSha256=$env:NED_ARTIFACT_SHA256
            os=[Environment]::OSVersion.Version.ToString()
            installerMilliseconds=$watch.ElapsedMilliseconds
            comparisonOrder='candidate clean install; Windows Server runner'
            installedFiles=$files.Count
            installedBytes=($files | Measure-Object Length -Sum).Sum
            openVikingImport=$true; tokenizerEncodings=7; bundledNode=$true
            privateDataInstallRejected=$true
            bundledRuntimeInternetBlockedByWindowsFirewall=$true
            importStepModelsPrompted=$false; intranetModelsPrompted=$false; desktopActions=0
            namespaceTestUsesLocalSyntheticModels=$true
            realWin10Win11GuiAcceptance=$false
          } | ConvertTo-Json | Set-Content windows-offline-smoke.json -Encoding utf8
          Get-Content windows-offline-smoke.json
      - name: Verify skills, history, settings and terminal behavior after installation
        if: always() && env.NED_TEST_NODE != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = "downloads/Ned-${env:NED_ARTIFACT_VERSION}-windows-upgrade-test.cjs"
          $expected = (Get-Content "$test.sha256").Split(' ')[0]
          if ((Get-FileHash $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Upgrade test hash mismatch' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $run = Start-Process -FilePath $env:NED_TEST_NODE -ArgumentList @('--test', '--test-reporter=tap', (Resolve-Path $test).Path) -RedirectStandardOutput windows-upgrade-test.txt -RedirectStandardError windows-upgrade-stderr.txt -PassThru
          try {
            if (!$run.WaitForExit(600000)) { & taskkill.exe /PID $run.Id /T /F | Out-Null; throw 'Upgrade fixture exceeded its CI budget' }
            $run.Refresh()
            if ($run.ExitCode -ne 0) { throw 'Installed upgrade tests failed' }
          } finally {
            Get-Content windows-upgrade-test.txt -ErrorAction SilentlyContinue
            Get-Content windows-upgrade-stderr.txt -ErrorAction SilentlyContinue
          }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Update the previous installed release and verify user data
        if: env.NED_ARTIFACT_VERSION != '0.3.12'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'ned-smoke\missing-parent\Ned'
          if ((Split-Path $env:NED_TEST_NODE) -ne $install) { throw 'Unexpected disposable installer path' }
          $baseline = if ($env:NED_ARTIFACT_VERSION -eq '0.3.13') { '0.3.12-rebuild2' } elseif ($env:NED_ARTIFACT_VERSION -eq '0.4.0') { '0.3.16-rebuild1' } elseif ($env:NED_ARTIFACT_VERSION -match '^(0\.[34]\.\d+)-rebuild(\d+)$') { $n = [int]$Matches[2]; if ($n -gt 1) { "$($Matches[1])-rebuild$($n - 1)" } else { $Matches[1] } } elseif ($env:NED_ARTIFACT_VERSION -match '^0\.([34])\.(\d+)$') { "0.$($Matches[1]).$([int]$Matches[2] - 1)" } else { throw "Unsupported artifact version: $env:NED_ARTIFACT_VERSION" }
          $previous = Join-Path $env:RUNNER_TEMP "Ned-$baseline-previous.exe"
          $audit = Get-Content "downloads/Ned-$baseline-installer-audit.json" -Raw | ConvertFrom-Json
          $url = "https://github.com/SungKyu-Kim39/AgentHarness/releases/download/v$baseline/Ned-$baseline-win-x64.exe"
          & curl.exe --fail --location --retry 2 --output $previous $url
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $previous -Algorithm SHA256).Hash -ne $audit.installer.sha256) { throw 'Published installer hash mismatch' }
          $uninstall = Start-Process -FilePath (Join-Path $install 'Uninstall Ned.exe') -ArgumentList @('/S', "_?=$install") -Wait -PassThru
          $uninstall.Refresh()
          if ($uninstall.ExitCode -ne 0) { throw "Clean candidate uninstall failed: $($uninstall.ExitCode)" }
          # The explicit NSIS _?= mode can leave the running uninstaller in
          # this fixture path. The released installer requires an empty path.
          if (Test-Path -LiteralPath $install) { Remove-Item -LiteralPath $install -Recurse -Force }
          $old = Start-Process -FilePath $previous -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          $old.Refresh()
          if ($old.ExitCode -ne 0) { throw "Previous installation failed: $($old.ExitCode)" }
          Remove-Item $previous -Force
          $skills = Join-Path $env:APPDATA 'Ned\skills\ned-release-fixture'
          $reference = Join-Path $skills 'references\guidance.md'
          New-Item -ItemType Directory (Split-Path $reference) -Force | Out-Null
          $main = Join-Path $skills 'SKILL.md'
          Set-Content $main -Encoding utf8 -Value @('---','name: ned-release-fixture','description: Windows upgrade verification','---','Persistent skill')
          Set-Content $reference -Encoding utf8 -Value 'Persistent reference'
          $dataRoot = Join-Path $env:APPDATA 'Ned'
          $saved = @('settings.enc.json','editor\threads\threads.db','openviking\data\update-fixture.txt')
          $savedPaths = foreach ($relative in $saved) {
            $file = Join-Path $dataRoot $relative
            New-Item -ItemType Directory -Path (Split-Path $file) -Force | Out-Null
            if (!(Test-Path -LiteralPath $file)) { Set-Content -LiteralPath $file -Value 'Ned installer preservation fixture' }
            $file
          }
          if ($env:NED_ARTIFACT_VERSION -in @('0.4.0-rebuild5','0.4.0-rebuild6')) {
            $extra = Join-Path $install 'user-file-fixture.txt'
            Set-Content -LiteralPath $extra -Value 'Ned does not own this file'
            $savedPaths = @($savedPaths) + @($extra)
            $legacyExtra = Join-Path $install 'legacy-recovered-fixture.txt'
            Set-Content -LiteralPath $legacyExtra -Value 'Legacy upgrade backup user file'
            $savedPaths = @($savedPaths) + @($legacyExtra)
          }
          $before = Get-FileHash -LiteralPath (@($main,$reference)+$savedPaths)
          $interruptedUpgradeRecovered = $false
          if ($env:NED_ARTIFACT_VERSION -in @('0.4.0-rebuild3','0.4.0-rebuild4','0.4.0-rebuild5','0.4.0-rebuild6')) {
            $backup = Join-Path $install '.ned-upgrade-backup'
            New-Item -ItemType Directory -Path $backup | Out-Null
            if ($env:NED_ARTIFACT_VERSION -in @('0.4.0-rebuild4','0.4.0-rebuild5','0.4.0-rebuild6')) {
              if ($env:NED_ARTIFACT_VERSION -in @('0.4.0-rebuild5','0.4.0-rebuild6')) {
                Move-Item -LiteralPath $legacyExtra -Destination $backup
              }
              # Simulate partial rollback failure: resources already restored to live,
              # while Ned.exe and a top-level Electron runtime file remain in .ned-upgrade-backup.
              foreach ($item in @('Ned.exe','ffmpeg.dll','locales')) {
                if (Test-Path -LiteralPath (Join-Path $install $item)) {
                  Move-Item -LiteralPath (Join-Path $install $item) -Destination (Join-Path $backup $item)
                }
              }
              $backedExe = Join-Path $backup 'Ned.exe'
              $backedFfmpeg = Join-Path $backup 'ffmpeg.dll'
              $backupHash = (Get-FileHash -LiteralPath $backedExe).Hash
              $ffmpegHash = (Get-FileHash -LiteralPath $backedFfmpeg).Hash
              $partial = Join-Path $install 'ffmpeg.dll'
              Set-Content -LiteralPath $partial -Value 'Simulated partial top-level DLL'
              $lock = [IO.File]::Open($partial, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::None)
              try {
                $blocked = Start-Process -FilePath $env:NED_SMOKE_EXE -ArgumentList @('/S', "/D=$install") -Wait -PassThru
                $blocked.Refresh()
                if ($blocked.ExitCode -eq 0 -or !(Test-Path -LiteralPath $backedFfmpeg) -or
                    (Get-FileHash -LiteralPath $backedFfmpeg).Hash -ne $ffmpegHash) {
                  throw 'A blocked top-level restore did not preserve the backed-up runtime file'
                }
              } finally { $lock.Dispose() }
              # Ned.exe may already have been restored to live while locked ffmpeg.dll stayed in backup;
              # either way, original Ned.exe bytes must be intact and retrying in the same directory must recover.
              $liveExe = Join-Path $install 'Ned.exe'
              $exePath = if (Test-Path -LiteralPath $liveExe) { $liveExe } elseif (Test-Path -LiteralPath $backedExe) { $backedExe } else { $null }
              if (!$exePath -or (Get-FileHash -LiteralPath $exePath).Hash -ne $backupHash) {
                throw 'Backed-up Ned.exe was lost during blocked restore'
              }
            } else {
              foreach ($item in @('resources','locales','Ned.exe')) {
                Move-Item -LiteralPath (Join-Path $install $item) -Destination (Join-Path $backup $item)
              }
              $backedAsar = Join-Path $backup 'resources\app.asar'
              $backupHash = (Get-FileHash -LiteralPath $backedAsar).Hash
              $partialFolder = Join-Path $install 'resources'
              New-Item -ItemType Directory -Path $partialFolder | Out-Null
              $partial = Join-Path $partialFolder 'locked-partial-fixture.txt'
              Set-Content -LiteralPath $partial -Value 'Simulated interrupted installation'
              $lock = [IO.File]::Open($partial, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::None)
              try {
                $blocked = Start-Process -FilePath $env:NED_SMOKE_EXE -ArgumentList @('/S', "/D=$install") -Wait -PassThru
                $blocked.Refresh()
                if ($blocked.ExitCode -eq 0 -or !(Test-Path -LiteralPath $backedAsar) -or
                    (Get-FileHash -LiteralPath $backedAsar).Hash -ne $backupHash) {
                  throw 'A blocked restore did not preserve the original backed-up payload'
                }
              } finally { $lock.Dispose() }
            }
            $interruptedUpgradeRecovered = $true
          }
          $upgrade = Start-Process -FilePath $env:NED_SMOKE_EXE -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          $upgrade.Refresh()
          if ($upgrade.ExitCode -ne 0) { throw 'Candidate update failed' }
          if ($interruptedUpgradeRecovered -and (Test-Path -LiteralPath $backup)) { throw 'Recovery backup was not cleared after successful update' }
          foreach ($file in $before) {
            if ((Get-FileHash $file.Path).Hash -ne $file.Hash) { throw 'User data changed during update' }
          }
          $info = Get-Content (Join-Path $install 'resources\ned\build-info.json') -Raw | ConvertFrom-Json
          $expectedBase = ($env:NED_ARTIFACT_VERSION -split '-')[0]
          $expectedRev = if ($env:NED_ARTIFACT_VERSION -match '-(.+)$') { $Matches[1] } else { $null }
          if ($info.version -ne $expectedBase -or $info.buildRevision -ne $expectedRev -or $info.sourceCommit -ne $env:NED_CANDIDATE_SOURCE) { throw 'Wrong version after update' }
          foreach ($obsolete in @('skill-seed','personal-pack-recovery.py')) {
            if (Test-Path (Join-Path $install "resources\ned\$obsolete")) { throw "Removed resource remains after update: $obsolete" }
          }
          $proof = Get-Content windows-offline-smoke.json -Raw | ConvertFrom-Json
          $proof | Add-Member -NotePropertyName upgradedFrom -NotePropertyValue $baseline
          $proof | Add-Member -NotePropertyName userGlobalSkillsPreserved -NotePropertyValue $true
          $proof | Add-Member -NotePropertyName userDataPreserved -NotePropertyValue $true
          $proof | Add-Member -NotePropertyName interruptedUpgradeRecovered -NotePropertyValue $interruptedUpgradeRecovered
          if ($env:NED_ARTIFACT_VERSION -in @('0.4.0-rebuild5','0.4.0-rebuild6')) {
            $proof | Add-Member -NotePropertyName installFolderUserFilesPreserved -NotePropertyValue $true
          }
          if ($env:NED_ARTIFACT_VERSION -eq '0.4.0-rebuild6') {
            $unrestored = Join-Path $backup 'unrecovered-fixture.txt'
            New-Item -ItemType Directory -Path $backup | Out-Null
            Set-Content -LiteralPath $unrestored -Value 'Unrecovered user backup fixture'
            $preserved = @($before) + @(Get-FileHash -LiteralPath $unrestored)
            $remove = Start-Process -FilePath (Join-Path $install 'Uninstall Ned.exe') -ArgumentList @('/S', "_?=$install") -Wait -PassThru
            $remove.Refresh()
            if ($remove.ExitCode -ne 0) { throw 'Candidate preservation uninstall failed' }
            foreach ($owned in @('Ned.exe','resources','locales','ffmpeg.dll')) {
              if (Test-Path -LiteralPath (Join-Path $install $owned)) { throw "Owned payload remains after removal: $owned" }
            }
            foreach ($file in $preserved) {
              if ((Get-FileHash -LiteralPath $file.Path).Hash -ne $file.Hash) { throw 'Uninstall did not preserve user bytes' }
            }
            $proof | Add-Member -NotePropertyName uninstallUserFilesPreserved -NotePropertyValue $true
          }
          $proof | ConvertTo-Json | Set-Content windows-offline-smoke.json -Encoding utf8
      - name: Restore disposable runner firewall configuration
        if: always()
        shell: pwsh
        run: |
          if ($env:NED_FIREWALL_GROUP) { Get-NetFirewallRule -Group $env:NED_FIREWALL_GROUP -ErrorAction SilentlyContinue | Remove-NetFirewallRule }
          if (Test-Path firewall-before.json) {
            foreach ($profile in (Get-Content firewall-before.json -Raw | ConvertFrom-Json)) { Set-NetFirewallProfile -Profile $profile.Name -Enabled $profile.Enabled }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-offline-smoke-${{ env.NED_ARTIFACT_VERSION }}
          path: |
            windows-offline-smoke.json
            windows-upgrade-test.txt
            windows-upgrade-stderr.txt
          if-no-files-found: ignore

  editor-source-build:
    if: inputs.artifact_version == 'editor-source-build' || inputs.artifact_version == 'terminal-source-probe' || inputs.artifact_version == 'terminal-editor-probe' || inputs.artifact_version == 'global-skills-source-probe'
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      RUSTUP_TOOLCHAIN: 1.98.1
      ZED_COMMIT_SHA: e8bc16acee5ae1937600d571d441c4b5d7b0d288
      ZED_RELEASE_CHANNEL: stable
      RELEASE_CHANNEL: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the Windows terminal host paths
        if: inputs.artifact_version == 'editor-source-build' || inputs.artifact_version == 'terminal-source-probe'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.3.10') { exit 0 }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Terminal test prerequisites failed' }
          $env:NED_SHELL_TEST_PYTHON = (Get-Command python.exe).Source
          & node --import tsx --test tests/terminal-jobs.windows.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Windows terminal host test failed' }
      - name: Verify global skills survive an NSIS update
        if: inputs.artifact_version == 'global-skills-source-probe'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Installer test prerequisites failed' }
          & node --test tests/global-skills.windows.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Global skills installer upgrade test failed' }
      - name: Prepare the pinned source and Ned UI changes
        if: inputs.artifact_version == 'editor-source-build' || inputs.artifact_version == 'terminal-editor-probe'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content ned-editor-source-lock.json -Raw | ConvertFrom-Json
          $archive = $lock.upstream.artifacts | Where-Object file -eq 'zed-source-v1.28.1.tar.gz'
          $package = Join-Path $env:RUNNER_TEMP 'zed-source.tar.gz'
          & curl.exe --fail --location --retry 2 --output $package $archive.url
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne $archive.sha256) { throw 'Source archive mismatch' }
          $source = Join-Path $env:RUNNER_TEMP 'ned-editor-source'
          $out = Join-Path $env:RUNNER_TEMP 'ned-editor-output'
          New-Item -ItemType Directory $source,$out -Force | Out-Null
          & tar.exe -xzf $package --strip-components=1 -C $source
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          & node scripts/patch-ned-editor.mjs $source
          if ($LASTEXITCODE -ne 0) { throw 'Editor patch failed' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $artifact = $version + $(if ($env:NED_BUILD_REVISION) { '-' + $env:NED_BUILD_REVISION } else { '' })
          "NED_EDITOR_ARTIFACT=$artifact" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ('${{ inputs.artifact_version }}' -eq 'editor-source-build') {
            & tar.exe -czf (Join-Path $out "zed-ned-editor-source-v1.28.1-$artifact.tar.gz") -C $source .
            if ($LASTEXITCODE -ne 0) { throw 'Corresponding source packaging failed' }
          }
          "NED_EDITOR_SOURCE=$source" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NED_EDITOR_OUTPUT=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the edited Windows x64 executable
        if: inputs.artifact_version == 'editor-source-build' || inputs.artifact_version == 'terminal-editor-probe'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64
          & rustup toolchain install 1.98.1 --profile minimal --component rust-src
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust installation failed' }
          Set-Location $env:NED_EDITOR_SOURCE
          if ('${{ inputs.artifact_version }}' -eq 'terminal-editor-probe') {
            $env:CARGO_BUILD_JOBS = [Math]::Min(4, [Environment]::ProcessorCount)
            & cargo --config .cargo/bundle-config.toml check --release --locked --package terminal_view --target x86_64-pc-windows-msvc
            exit $LASTEXITCODE
          }
          & cargo --config .cargo/bundle-config.toml build --release --locked --package zed --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Editor source build failed' }
          Copy-Item target/x86_64-pc-windows-msvc/release/zed.exe (Join-Path $env:NED_EDITOR_OUTPUT "Ned-editor-${env:NED_EDITOR_ARTIFACT}.exe")
      - name: Check visible menu strings and record binary provenance
        if: inputs.artifact_version == 'editor-source-build'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NED_EDITOR_BUILD_SHA = $env:GITHUB_SHA
          @'
          const fs=require('node:fs'),p=require('node:path'),crypto=require('node:crypto');
          const folder=process.env.NED_EDITOR_OUTPUT,version=JSON.parse(fs.readFileSync('package.json')).version,revision=process.env.NED_BUILD_REVISION||'',artifact=process.env.NED_EDITOR_ARTIFACT;
          const binary=`Ned-editor-${artifact}.exe`,archive=`zed-ned-editor-source-v1.28.1-${artifact}.tar.gz`,about=`Ned ${version}`+(revision?' · rebuild '+revision.slice(7):'');
          const exe=fs.readFileSync(p.join(folder,binary));
          const m = /^0\.([34])\.(\d+)$/.exec(version);
          const hasManagedTerminal = !!m && (Number(m[1]) >= 4 || Number(m[2]) >= 10);
          const labels=['About Ned','Quit Ned',about,...(hasManagedTerminal?['NED_MANAGED_TERMINAL','PowerShell','CMD']:[])];
          for(const s of labels)if(!exe.includes(Buffer.from(s)))throw Error('Missing compiled UI: '+s);
          for(const s of ['About Zed','Quit Zed'])if(exe.includes(Buffer.from(s)))throw Error('Old compiled menu: '+s);
          const files=[binary,archive].map(name=>{const bytes=fs.readFileSync(p.join(folder,name));return {name,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')}});
          const result={schemaVersion:1,product:'Ned editor',version,buildRevision:revision||undefined,sourceCommit:process.env.NED_EDITOR_BUILD_SHA,upstreamVersion:'1.28.1',upstreamCommit:'e8bc16acee5ae1937600d571d441c4b5d7b0d288',os:'Windows Server 2022',rust:'1.98.1',profile:'release; upstream bundle config; debug symbols disabled; 2 build jobs',files,windowsGuiAcceptance:false};
          fs.writeFileSync(p.join(folder,`build-${artifact}.json`),JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result));
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Built editor validation failed' }
      - name: Upload versioned components for review
        if: inputs.artifact_version == 'editor-source-build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ned-editor-${{ env.NED_EDITOR_ARTIFACT }}-${{ github.sha }}
          path: ${{ env.NED_EDITOR_OUTPUT }}
          if-no-files-found: error

  release-build:
    if: inputs.artifact_version == 'release-build'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NED_EDITOR_RUN: ${{ inputs.editor_run }}
      NED_BUILD_REVISION: ${{ inputs.build_revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Prepare build-machine space and Java 21
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          df -h .
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and audit immutable installer candidate
        id: candidate
        run: node scripts/release-candidate.mjs candidate
      - name: Store candidate binaries outside Git LFS
        if: startsWith(steps.candidate.outputs.version, '0.3.') || startsWith(steps.candidate.outputs.version, '0.4.')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ned-${{ steps.candidate.outputs.version }}-installer-assets-${{ steps.candidate.outputs.source_sha }}
          path: |
            release/ned/Ned-${{ steps.candidate.outputs.version }}-win-x64.exe
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ned-${{ steps.candidate.outputs.version }}-release-state-${{ steps.candidate.outputs.source_sha }}
          path: .cache/ned/release-state
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
